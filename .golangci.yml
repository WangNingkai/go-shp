run:
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: false

linters:
  disable-all: true
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - goconst
    - gocritic
    - gocyclo
    - gofmt
    - goimports
    - goheader
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace

linters-settings:
  errcheck:
    exclude-functions:
      - io.Reader.Read
      - io.Writer.Write
  gocognit:
    min-complexity: 20
  gocyclo:
    min-complexity: 15
  goimports:
    local-prefixes: github.com/wangningkai/go-shp
  revive:
    rules:
      - name: unused-parameter
  staticcheck:
    checks:
      - all
      - -SA1000
      - -SA1019
      - -SA5001
      - -SA5002
      - -ST1000
      - -ST1005

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - goconst
        - gocyclo